[package]
name = "ashfall-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "ashfall_desktop"

[[bin]]
name = "ashfall-local"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ashfall-client-core = { path = "../crates/client-core" }
tauri = { version = "2", features = ["dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
