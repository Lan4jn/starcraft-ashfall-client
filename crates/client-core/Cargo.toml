[package]
name = "ashfall-client-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
percent-encoding = "2"
sha2 = "0.10"
rand = "0.8"
fs2 = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
